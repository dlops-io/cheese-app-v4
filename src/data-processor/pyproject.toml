[project]
name = "cheese-app-data-processor"
version = "4.0.0"
description = "Removes duplicate and broken photos and saves the rest, as JPEGs, to the ML bucket"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-cloud-storage>=3.4.0",
    "pillow>=12.0.0",
]

# A command-line tool, not a library: install the dependencies only, never build a wheel of this project.
[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = ["ruff==0.17.3"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
